{% extends "base.html" %}
{% block title %}Analytics · Spendly{% endblock %}

{% block content %}
<div class="coming-soon-page">
    <div class="coming-soon-bg-blob coming-soon-bg-blob--tl" aria-hidden="true"></div>
    <div class="coming-soon-bg-blob coming-soon-bg-blob--br" aria-hidden="true"></div>

    <div class="coming-soon-card">
        <div class="coming-soon-corner coming-soon-corner--tr" aria-hidden="true"></div>
        <div class="coming-soon-corner coming-soon-corner--bl" aria-hidden="true"></div>

        <div class="coming-soon-icon-wrap">
            <div class="coming-soon-icon-glow" aria-hidden="true"></div>
            <div class="coming-soon-icon-box">
                <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <circle cx="24" cy="24" r="17" stroke="white" stroke-width="2.5"/>
                    <path d="M24 14v10l6.5 4" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
        </div>

        <div class="coming-soon-badge">Coming Soon</div>

        <h1 class="coming-soon-title">Advanced Analytics</h1>

        <p class="coming-soon-subtitle">
            We're working on powerful insights and visualizations
            to help you understand your spending patterns better.
        </p>

        <div class="coming-soon-dots" aria-hidden="true">
            <span class="coming-soon-dot coming-soon-dot--1"></span>
            <span class="coming-soon-dot coming-soon-dot--2"></span>
            <span class="coming-soon-dot coming-soon-dot--3"></span>
        </div>

        <p class="coming-soon-caption">We're crafting something special</p>

        <div class="coming-soon-line" aria-hidden="true"></div>
    </div>
</div>
{% endblock %}
